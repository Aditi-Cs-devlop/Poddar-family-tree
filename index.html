@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:linear-gradient(160deg,#1c1511 0%,#271a16 55%,#321f1a 100%);--card:#2a211a;--ink:#f3e8d6;--sub:#c2ae92;--line:#c9923f;--accent:#e58a8f;--hl:#6b5a14;
--y:#5a4a1c;--g:#3b4630;--l:#3f3a58;--b:#1f4458;--p:#5b2b42;--s:#5a3626;--m:#25472f;--bar:rgba(35,25,20,.9)}}
:root[data-theme="dark"]{--bg:linear-gradient(160deg,#1c1511 0%,#271a16 55%,#321f1a 100%);--card:#2a211a;--ink:#f3e8d6;--sub:#c2ae92;--line:#c9923f;--accent:#e58a8f;--hl:#6b5a14;
--y:#5a4a1c;--g:#3b4630;--l:#3f3a58;--b:#1f4458;--p:#5b2b42;--s:#5a3626;--m:#25472f;--bar:rgba(35,25,20,.9)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg) fixed;color:var(--ink);font-family:Georgia,'Times New Roman',serif}
h1{text-align:center;font-weight:normal;letter-spacing:.14em;margin:18px 12px 2px;color:var(--accent)}
p.hint{text-align:center;color:var(--sub);margin:0 12px 10px;font-size:14px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:8px 12px;background:var(--bar);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar input{font:inherit;font-size:14px;padding:7px 12px;border:1.5px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink);width:min(260px,60vw)}
.bar button{font:inherit;font-size:13px;padding:7px 14px;border:1.5px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink);cursor:pointer}
.bar button:hover{border-color:var(--accent);color:var(--accent)}
#cnt{font-size:12px;color:var(--sub)}
.wrap{overflow-x:auto;padding:18px 16px 60px}
.tree{display:flex;justify-content:center;min-width:max-content}
.tree ul{display:flex;justify-content:center;padding:20px 0 0;margin:0;position:relative}
.tree>ul{padding-top:0}
.tree li{list-style:none;text-align:center;position:relative;padding:20px 8px 0}
.tree>ul>li{padding-top:0}
.tree li::before,.tree li::after{content:'';position:absolute;top:0;right:50%;width:50%;height:20px;border-top:2px solid var(--line)}
.tree li::after{right:auto;left:50%;border-left:2px solid var(--line)}
.tree>ul>li::before,.tree>ul>li::after,.tree li:only-child::before,.tree li:only-child::after{display:none}
.tree li:only-child{padding-top:0}
.tree li:first-child::before,.tree li:last-child::after{border:0}
.tree li:last-child::before{border-right:2px solid var(--line);border-radius:0 8px 0 0}
.tree li:first-child::after{border-radius:8px 0 0 0}
.tree ul ul::before{content:'';position:absolute;top:0;left:50%;height:20px;border-left:2px solid var(--line)}
.node{font:inherit;color:var(--ink);background:var(--t,var(--y));border:2px solid var(--line);border-radius:10px;padding:8px 12px;min-width:110px;max-width:170px;cursor:default;position:relative;box-shadow:0 2px 5px rgba(80,50,10,.15)}
.node.has{cursor:pointer}
.node.has:hover{border-color:var(--accent);transform:translateY(-1px)}
.node.open{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.node.hit{background:var(--hl);outline:3px solid var(--accent)}
.node .n{display:block;font-weight:bold;font-size:14px}
.node .s{display:block;font-size:12px;color:var(--sub);margin-top:2px}
.node .b{position:absolute;right:-8px;top:-9px;background:var(--accent);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;font-family:sans-serif}
.node.leaf{border-style:dashed}
.kids{animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
</style>

let mode="root",query="";

function mark(d){
  d._hit=!!query&&d.n.toLowerCase().includes(query)||!!query&&(d.s||"").toLowerCase().includes(query);
  d._sub=false;
  (d.c||[]).forEach(k=>{mark(k);if(k._hit||k._sub)d._sub=true});
}
function build(d,tint){
  tint=TINT[d.n]||tint;
  const li=document.createElement('li'),b=document.createElement('button'),kids=d.c||[];
  b.className='node'+(kids.length?' has':' leaf')+(d._hit?' hit':'');
  b.style.setProperty('--t','var(--'+tint+')');
  b.innerHTML='<span class="n"></span>'+(d.s?'<span class="s"></span>':'')+(d.loc?'<span class="s loc"></span>':'')+(kids.length?'<span class="b">'+kids.length+'</span>':'');

  if(d.s)b.querySelector('.s').textContent=d.s;
  if(d.loc)b.querySelector('.loc').textContent='('+d.loc+')';
  li.appendChild(b);
  if(kids.length){
    let ul=null;
    const open=()=>{ul=document.createElement('ul');ul.className='kids';kids.forEach(k=>ul.appendChild(build(k,tint)));li.appendChild(ul);b.classList.add('open')};

  return li;
}
